<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Radar Wi-Fi</title>
    <style>
        body { background: #050510; color: white; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .radar-circle { width: 120px; height: 120px; border: 2px solid #0094ff; border-radius: 50%; margin: 30px auto; position: relative; animation: pulse 2s infinite ease-out; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; box-shadow: 0 0 30px #0094ff; } }
        .status { color: #00ff88; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <h2>📡 MODO ESCUCHA GALAXY</h2>
    <div class="radar-circle"></div>
    <p class="status">SINTONIZANDO RED LOCAL...</p>
    <p id="dev-info" style="color: #888; font-size: 12px;"></p>

    <script>
        const API = "/api";
        // Generar un ID único aleatorio para este teléfono al entrar
        const myId = "CEL-" + Math.floor(1000 + Math.random() * 9000);
        
        // Intentar deducir qué teléfono es usando el UserAgent (ej: Samsung, Xiaomi)
        let modelo = "Dispositivo Móvil";
        if (navigator.userAgent.includes("Android")) {
            const match = navigator.userAgent.match(/Android\s([0-9\.]+);\s([^;)]+)/);
            if(match) modelo = match[2];
        }

        document.getElementById('dev-info').innerText = `ID: ${myId} | Modelo: ${modelo}`;

        // Avisarle al backend que estamos vivos (Hacer ping cada 3 segundos)
        async function reportarPresencia() {
            try {
                const res = await fetch(`${API}/wifi/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: myId, nombre: "Celuleke Familiar", modelo: modelo })
                });
                const data = await res.json();
                
                // Si el servidor nos envió un archivo disparado por el radar:
                if (data.archivoPendiente) {
                    alert("📥 ¡Inyección de archivo recibida por Radar!");
                    window.location.href = data.urlDescarga; // Descarga automática directa
                }
            } catch (e) {
                console.error("Fallo de enlace con la base del Radar", e);
            }
        }

        setInterval(reportarPresencia, 3000);
        reportarPresencia();
    </script>
</body>
</html>
