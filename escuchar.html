<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Radar Wi-Fi 📡</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: sans-serif;
            text-align: center;
            padding: 30px 15px;
        }
        .status-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .pulse {
            width: 15px;
            height: 15px;
            background: #238636;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .btn-dl {
            display: inline-block;
            margin-top: 20px;
            background: #21262d;
            color: #ecf2f8;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #f0f6fc1a;
            font-weight: bold;
        }
        .btn-dl:hover { background: #30363d; }
    </style>
</head>
<body>

    <h2>📡 Receptor de Radar Galaxy Cloud</h2>
    <p>Mantén esta pantalla abierta en tu celuleke para seguir en órbita local.</p>

    <div class="status-card">
        <p><strong>Identificación:</strong> <span id="modelo">Escaneando firma...</span></p>
        <p><strong>Estado del Canal:</strong> <span id="estado">Conectando...</span> <span class="pulse" id="foco" style="background:#8b949e;"></span></p>
    </div>

    <div id="buzon" style="margin-top: 30px;"></div>

    <script>
        const modeloTxt = document.getElementById('modelo');
        const estadoTxt = document.getElementById('estado');
        const foco = document.getElementById('foco');
        const buzon = document.getElementById('buzon');

        // Iniciamos el canal Server-Sent Events hacia el backend
        const evtSource = new EventSource('/api/wifi/escuchar');

        evtSource.onopen = () => {
            estadoTxt.innerText = "Sintonizado / En Línea";
            foco.style.background = "#238636";
        };

        evtSource.onerror = () => {
            estadoTxt.innerText = "Fuera de cobertura o reconectando...";
            foco.style.background = "#da3633";
        };

        // Escuchamos los eventos del servidor
        evtSource.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // 1. Cuando el servidor nos identifica
            if (data.tipo === 'identificacion') {
                modeloTxt.innerText = data.modelo;
            }

            // 2. Cuando la PC nos dispara un archivo directo por ráfaga de Wi-Fi
            if (data.tipo === 'archivo') {
                buzon.innerHTML = `
                    <div style="background:#1f6feb; color:white; padding:15px; border-radius:8px; animation: bounce 0.5s;">
                        <h3>🚀 ¡Ráfaga de archivo recibida!</h3>
                        <p>ID en la nube: <code>${data.fileId}</code></p>
                        <a href="${data.url}" class="btn-dl" download>📥 Descargar Archivo Directo</a>
                    </div>
                `;
                
                // Opción automática por si el navegador bloquea los popups en motores viejos
                // window.location.href = data.url;
            }
        };
    </script>
</body>
</html>
