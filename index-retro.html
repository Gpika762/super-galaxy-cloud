<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Cloud + | Modo Retro</title>
    <style>
        /* Fondo degradado oscuro con la esencia espacial del Pro */
        body {
            background: #0a0f1d linear-gradient(135deg, #0a0f1d 0%, #070a14 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        /* Contenedor principal estilizado con bordes neón suaves */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #111827;
            border: 2px solid #1e293b;
            border-top: 3px solid #3b82f6; /* Detalle azul neón superior */
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        /* Encabezado con estética sci-fi */
        h1 {
            color: #3b82f6;
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Zona de carga / Caja del formulario */
        .upload-box {
            border: 2px dashed #334155;
            border-radius: 8px;
            padding: 30px 15px;
            background-color: #0f172a;
            margin-bottom: 20px;
        }

        .upload-box h3 {
            color: #f1f5f9;
            margin-top: 0;
            font-size: 18px;
        }

        .upload-box p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Estilización del input nativo "Seleccionar archivo" */
        input[type="file"] {
            color: #94a3b8;
            font-size: 14px;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            width: 90%;
            max-width: 350px;
        }

        /* Botón de acción principal con degradado azul tecnológico */
        .btn-submit {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 25px auto 0 auto;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Pie de página discreto */
        .footer {
            margin-top: 35px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GALAXY CLOUD +</h1>
        <p class="subtitle">Modo Retro-Esencial Activo</p>
        
        <form action="/api/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <h3>🚀 Subir Archivo</h3>
                <p>Tu terminal enviará el elemento de forma directa y optimizada a la central Cloudinary.</p>
                
                <input type="file" name="archivo" required>
            </div>
            
            <button type="submit" class="btn-submit">Subir a la Nube</button>
        </form>
        
        <div class="footer">
            Conectado desde un dispositivo clásico balanceado por el servidor.
        </div>
    </div>

</body>
</html>
