<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Subida Exitosa! | Galaxy Cloud</title>
    <style>
        body {
            background: #0a0f1d linear-gradient(135deg, #0a0f1d 0%, #070a14 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #111827;
            border: 2px solid #1e293b;
            border-top: 3px solid #10b981; /* Borde verde de éxito */
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #10b981; /* Verde neón suave */
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .icon-check {
            font-size: 50px;
            margin: 15px 0;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }

        .device-info {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 6px;
            color: #3b82f6;
            font-weight: bold;
            margin: 20px 0;
            display: inline-block;
            font-size: 14px;
        }

        .btn-back {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-check">✅</div>
        <h1>¡ARCHIVO RECIBIDO!</h1>
        
        <p>El archivo se ha subido correctamente a los servidores de Galaxy Cloud y ya está disponible en el radar.</p>
        
        <div class="device-info" id="device-box">
            Procesado con éxito
        </div>
        
        <br>
        <a href="/retro" class="btn-back">Subir otro archivo</a>
    </div>

    <script>
        // Pequeño script ultra básico compatible con navegadores viejos para extraer el nombre del dispositivo de la URL
        function getDeviceParam() {
            var params = window.location.search.substring(1).split("&");
            for (var i = 0; i < params.length; i++) {
                var pair = params[i].split("=");
                if (pair[0] == "device") {
                    return decodeURIComponent(pair[1].replace(/\+/g, " "));
                }
            }
            return null;
        }
        var device = getDeviceParam();
        if (device) {
            document.getElementById("device-box").innerText = "Detectado: " + device;
        }
    </script>
</body>
</html>
